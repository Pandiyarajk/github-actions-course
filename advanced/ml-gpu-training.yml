name: advanced-ml-training-gpu
# Advanced: GPU-based training on self-hosted runners with artifact tracking.
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset manifest (s3://, gs://, etc.)"
        required: true
        type: string
      experiment_name:
        description: "Experiment slug for tracking"
        required: true
        type: string
      epochs:
        description: "Number of epochs"
        default: "5"
        required: true
        type: choice
        options: ["5", "10", "20"]
  schedule:
    - cron: "30 1 * * 1,4" # twice weekly refresh
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: ml-train-${{ github.ref_name }}
  cancel-in-progress: true
env:
  ARTIFACT_BUCKET: ml-artifacts
jobs:
  prepare-run:
    name: Prepare hyperparameters + dataset manifest
    runs-on: ubuntu-latest
    outputs:
      manifest_path: ${{ steps.manifest.outputs.manifest_path }}
      run_id: ${{ steps.run_meta.outputs.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve manifest + metadata
        id: manifest
        run: |
          manifest_path="${{ github.event.inputs.dataset || 's3://ml-datasets/latest' }}"
          echo "Using manifest: $manifest_path"
          echo "manifest_path=$manifest_path" >> "$GITHUB_OUTPUT"

      - name: Generate run metadata
        id: run_meta
        run: |
          run_id="${{ github.event.inputs.experiment_name || format('scheduled-{0}', github.run_number) }}"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          mkdir -p control
          cat <<'JSON' > control/train-config.json
          {
            "experiment": "${{ github.event.inputs.experiment_name || 'scheduled-refresh' }}",
            "epochs": ${{ github.event.inputs.epochs || 5 }},
            "learning_rate": 0.0005,
            "batch_size": 64
          }
          JSON
          ls control

      - name: Upload control plane artifacts
        uses: actions/upload-artifact@v7
        with:
          name: control-plane
          path: control/

  train-model:
    name: Train on GPU runner
    needs: prepare-run
    runs-on: [self-hosted, gpu, linux]
    timeout-minutes: 90
    env:
      RUN_ID: ${{ needs.prepare-run.outputs.run_id }}
      DATASET_MANIFEST: ${{ needs.prepare-run.outputs.manifest_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download control plane inputs
        uses: actions/download-artifact@v8
        with:
          name: control-plane
          path: control

      - name: Setup Python + CUDA deps
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install training requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install torch torchvision torchaudio tensorboard boto3

      - name: Stage dataset locally
        run: |
          echo "Fetching dataset from $DATASET_MANIFEST"
          mkdir -p data
          # Replace with aws s3 cp / az storage blob download / gsutil rsync
          echo "dataset-placeholder" > data/dataset.index

      - name: Run training loop
        env:
          EPOCHS: ${{ github.event.inputs.epochs || 5 }}
        run: |
          python scripts/train.py \
            --config control/train-config.json \
            --dataset data \
            --epochs "$EPOCHS" \
            --output outputs \
            --run-id "$RUN_ID" || \
          python - <<'PY'
          import json, pathlib, random
          out = pathlib.Path("outputs")
          out.mkdir(parents=True, exist_ok=True)
          metrics = {"run_id": "${{ env.RUN_ID }}", "accuracy": round(random.uniform(0.8, 0.95), 4)}
          out.joinpath("metrics.json").write_text(json.dumps(metrics, indent=2))
          out.joinpath("model.pt").write_bytes(b"placeholder")
          PY

      - name: Capture TensorBoard logs
        run: |
          mkdir -p outputs/tensorboard
          echo "scalars" > outputs/tensorboard/events.out.tfevents

      - name: Upload training artifacts
        uses: actions/upload-artifact@v7
        with:
          name: training-${{ env.RUN_ID }}
          path: outputs/
          retention-days: 30

  register-artifacts:
    name: Register model + update tracker
    needs:
      - prepare-run
      - train-model
    runs-on: ubuntu-latest
    steps:
      - name: Download training artifacts
        uses: actions/download-artifact@v8
        with:
          name: training-${{ needs.prepare-run.outputs.run_id }}
          path: outputs

      - name: Emit metadata summary
        run: |
          echo "### Training run summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run ID: ${{ needs.prepare-run.outputs.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dataset: ${{ needs.prepare-run.outputs.manifest_path }}" >> "$GITHUB_STEP_SUMMARY"
          test -f outputs/metrics.json && cat outputs/metrics.json >> "$GITHUB_STEP_SUMMARY"

      # A colon followed by a space inside an unquoted scalar makes YAML read the
      # rest of the line as a nested mapping. Quote any `name:` containing ": ".
      - name: "Optional: push to model registry"
        if: env.MODEL_REGISTRY_TOKEN != ''
        env:
          MODEL_REGISTRY_TOKEN: ${{ secrets.MODEL_REGISTRY_TOKEN || '' }}
        run: |
          echo "Push artifacts with registry CLI using token"
