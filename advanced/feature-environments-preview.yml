name: advanced-feature-environments
# Advanced: Feature environments with automatic preview deploy + teardown.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optionally rebuild preview for PR #"
        required: false
        type: string
permissions:
  contents: read
  deployments: write
  pull-requests: write
  statuses: write
env:
  PREVIEW_TTL_HOURS: "24"
jobs:
  provision-preview:
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
      cancel-in-progress: true
    env:
      PREVIEW_KEY: pr-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve preview metadata
        id: metadata
        run: |
          echo "environment=preview-${PREVIEW_KEY}" >> "$GITHUB_OUTPUT"
          echo "preview_url=https://${PREVIEW_KEY}.preview.example.com" >> "$GITHUB_OUTPUT"

      - name: Install + build web bundle
        run: |
          npm ci
          npm run build

      - name: Package preview artifacts
        run: |
          tar -czf preview-${PREVIEW_KEY}.tgz dist/
          echo "Prepared preview bundle preview-${PREVIEW_KEY}.tgz"

      - name: Deploy preview (replace with actual infra CLI)
        env:
          PREVIEW_URL: ${{ steps.metadata.outputs.preview_url }}
        run: |
          echo "Deploying to $PREVIEW_URL"
          # e.g. vercel deploy --preload, helm upgrade --install, az containerapp up
          sleep 5

      - name: Publish GitHub deployment + PR comment
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.metadata.outputs.preview_url }}
        with:
          script: |
            const key = process.env.PREVIEW_KEY;
            const previewUrl = process.env.PREVIEW_URL;
            const envName = `preview-${key}`;
            const ttl = process.env.PREVIEW_TTL_HOURS;
            const refSha = context.payload.pull_request?.head.sha || context.sha;
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: refSha,
              environment: envName,
              transient_environment: true,
              production_environment: false,
              auto_merge: false,
              description: `Preview ${key} (expires in ${ttl}h)`
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: previewUrl,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (context.payload.pull_request) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: [
                  `🚀 Preview ready: ${previewUrl}`,
                  `• Environment: **${envName}**`,
                  `• Auto-teardown after ${ttl}h of inactivity`,
                  `• Triggered by ${context.actor}`
                ].join('\n')
              });
            }

  teardown-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Deactivate preview deployment(s)
        uses: actions/github-script@v7
        with:
          script: |
            const key = context.payload.pull_request.number;
            const envName = `preview-pr-${key}`;
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: envName,
                per_page: 100
              }
            );
            if (!deployments.length) {
              core.info(`No deployments to clean for ${envName}`);
              return;
            }
            for (const deployment of deployments) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                state: 'inactive',
                description: 'Preview auto-teardown (PR closed)',
                auto_inactive: true
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `🧹 Preview environments for ${envName} marked inactive.`
            });
