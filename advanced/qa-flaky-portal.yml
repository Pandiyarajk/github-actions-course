name: advanced-qa-portal
# Advanced: Aggregates flaky test stats and syncs to QA portal.
on:
  schedule:
    - cron: "15 */6 * * *" # every 6 hours
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: write
  id-token: write
jobs:
  aggregate:
    name: Aggregate flaky data
    runs-on: ubuntu-latest
    outputs:
      stats_path: ${{ steps.write.outputs.stats_path }}
    steps:
      - name: Pull workflow history
        id: history
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const since = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
              status: 'completed',
              created: `>${since.toISOString()}`
            });
            const qaRuns = runs.filter((run) =>
              /qa|selenium|ui-test/i.test(run.name || '') ||
              /qa/i.test(run.path || '')
            );
            const stats = {};
            for (const run of qaRuns) {
              const key = run.name || run.path || 'qa';
              if (!stats[key]) {
                stats[key] = { attempts: 0, retries: 0, flaky: 0 };
              }
              stats[key].attempts += 1;
              if ((run.run_attempt || 1) > 1) {
                stats[key].retries += 1;
                if (run.conclusion === 'success') {
                  stats[key].flaky += 1;
                }
              }
            }
            return JSON.stringify({ generated_at: new Date().toISOString(), stats }, null, 2);

      - name: Write stats file
        id: write
        # The step output is passed through `env:` rather than interpolated
        # directly into the `run:` block. Two reasons, both worth copying:
        #   1. A `${{ }}` expression substituted at column 0 would terminate the
        #      `run: |` block scalar and make the whole file invalid YAML.
        #   2. Interpolating untrusted content straight into a shell command is
        #      the classic Actions script-injection vector. An env var is quoted
        #      by the shell, never parsed as code.
        env:
          STATS_JSON: ${{ steps.history.outputs.result }}
        run: |
          mkdir -p qa
          printf '%s\n' "$STATS_JSON" > qa/flaky-summary.json
          echo "stats_path=qa/flaky-summary.json" >> "$GITHUB_OUTPUT"

      - name: Upload artifact for portal
        uses: actions/upload-artifact@v7
        with:
          name: flaky-summary
          path: qa/flaky-summary.json

  publish:
    name: Publish to QA portal
    runs-on: ubuntu-latest
    needs: aggregate
    # The secret is bound to a job-level env var so the step below can test it.
    # `secrets` is NOT an available context in an `if:` -- only env, github,
    # inputs, job, matrix, needs, runner, steps, strategy and vars are.
    env:
      QA_PORTAL_TOKEN: ${{ secrets.QA_PORTAL_TOKEN }}
    steps:
      - name: Download stats
        uses: actions/download-artifact@v8
        with:
          name: flaky-summary
          path: qa

      - name: Push to QA portal API
        # Reads the job-level env var, not the secrets context. Writing
        # `if: secrets.QA_PORTAL_TOKEN != ''` here is rejected as an
        # unavailable context.
        if: env.QA_PORTAL_TOKEN != ''
        run: |
          curl -X POST \
            -H "Authorization: Bearer $QA_PORTAL_TOKEN" \
            -H "Content-Type: application/json" \
            -d @qa/flaky-summary.json \
            https://qa-portal.example.com/api/flaky-insights

      - name: Open tracking issue when flakiness > 0.2
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const payload = JSON.parse(fs.readFileSync('qa/flaky-summary.json', 'utf8'));
            const offenders = Object.entries(payload.stats)
              .filter(([_, value]) => value.flaky / Math.max(1, value.attempts) > 0.2);
            if (!offenders.length) {
              core.info('No flaky suites above threshold');
              return;
            }
            const body = offenders.map(([name, value]) => {
              const rate = (value.flaky / value.attempts).toFixed(2);
              return `* ${name}: ${value.flaky}/${value.attempts} (${rate})`;
            }).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Flaky suites detected - ${new Date().toISOString().slice(0,10)}`,
              body: [
                'Scheduled QA portal ingest detected flaky suites above 20%.',
                body,
                `Artifacts: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              ].join('\n')
            })
