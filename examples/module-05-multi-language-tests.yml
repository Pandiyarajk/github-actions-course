# Module 5: Multi-layer test quality portal — Python BDD + static analysis + API
name: module-05-multi-language-tests
on:
  push:
    branches:
      - main
jobs:
  quality-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - layer: static-analysis
            tags: ""
          - layer: api-tests
            tags: "api"
          - layer: bdd-smoke
            tags: "smoke"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies for ${{ matrix.layer }}
        run: |
          pip install pylint behave selenium allure-behave requests

      - name: Static analysis
        if: ${{ matrix.layer == 'static-analysis' }}
        run: |
          pip install check-duplicate-functions check-duplicate-variables
          pylint your-solution-root-folder-name/ --exit-zero
          check-duplicate-functions your-solution-root-folder-name/

      - name: API health-check tests
        if: ${{ matrix.layer == 'api-tests' }}
        run: |
          behave --tags=${{ matrix.tags }} --no-capture \
            -f allure_behave.formatter:AllureFormatter \
            -o reports/allure-results

      - name: BDD smoke suite
        if: ${{ matrix.layer == 'bdd-smoke' }}
        run: |
          behave --tags=${{ matrix.tags }} --no-capture \
            -f allure_behave.formatter:AllureFormatter \
            -o reports/allure-results

      - name: Publish evidence
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.layer }}
          path: reports/
