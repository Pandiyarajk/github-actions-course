# Module 14: Matrix fan-out across browsers — Selenium BDD automation
name: module-14-matrix-and-reuse
on:
  pull_request:
  workflow_dispatch:
jobs:
  bdd-matrix:
    strategy:
      fail-fast: false  # keep collecting data even if one browser fails
      matrix:
        browser: [chrome, firefox, msedge]
        server: [server1, server2]
    runs-on: ${{ matrix.server }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install behave selenium allure-behave webdriver-manager

      - name: Run BDD suite on ${{ matrix.browser }}
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          behave --tags=regression \
            -D browser=${{ matrix.browser }} \
            --no-capture \
            -f allure_behave.formatter:AllureFormatter \
            -o reports/allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-${{ matrix.browser }}-${{ matrix.server }}
          path: reports/allure-results/
          retention-days: 30

  reusable-report:
    needs: bdd-matrix
    uses: ./.github/workflows/generate-allure-report.yml
    secrets: inherit
    with:
      environment: staging
