# Module 6: Docker build + cache + ephemeral services
name: module-06-docker-performance
on:
  push:
    paths:
      - "Dockerfile"
      - "src/**"  # limit runs to image-impacting changes
jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/acme/demo-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Buildx caching  # unlocks multi-platform + cache reuse
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image with cache
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha  # pull previous layers
          cache-to: type=gha,mode=max  # store new layers

      - name: Start dependencies for UI tests
        run: docker compose -f qa/selenium/docker-compose.yml up -d

      - name: Run UI tests against fresh stack
        run: npm run e2e

      - name: Teardown containers even on failure
        if: always()
        run: docker compose -f qa/selenium/docker-compose.yml down
