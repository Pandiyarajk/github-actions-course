# Module 8: Environment variables and secrets — setting and using them
#
# Covers:
#   - calling secrets into env (workflow / job / step level)
#   - setting static env values
#   - creating env values dynamically with $GITHUB_ENV
#   - passing values between steps with step outputs ($GITHUB_OUTPUT)
#   - reading env in bash, PowerShell, and cmd
#   - safely consuming secrets without printing them
name: module-08-env-and-secrets
run-name: Env & Secrets - ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Behave tag"
        type: string
        default: smoke
        required: true

# Workflow-level env: plain config shared by ALL jobs and steps.
# Never put secrets in plain workflow-level env you might echo — pull secrets
# in at the point of use instead (see job/step env below).
env:
  REPORT_HOME: reports
  ALLURE_RESULTS: reports/allure-results

jobs:
  linux-env:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Job-level env: secrets are read from the secrets context and exposed as
    # environment variables to every step in this job.
    env:
      TEST_TAGS: ${{ inputs.tags }}
      ZEPHYR_SCALE_TOKEN: ${{ secrets.ZEPHYR_SCALE_TOKEN }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # 1) Use workflow- and job-level env in a bash step ($VAR syntax).
      - name: Read env in bash
        run: |
          echo "Report home : $REPORT_HOME"        # from workflow env
          echo "Allure dir  : $ALLURE_RESULTS"     # from workflow env
          echo "Behave tags : $TEST_TAGS"          # from job env (input)

      # 2) Set a NEW env variable at runtime so LATER steps can read it.
      #    Append KEY=VALUE to the $GITHUB_ENV file.
      - name: Create a dynamic env variable
        run: |
          echo "RUN_LABEL=bdd-${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Set RUN_LABEL for later steps"

      # 3) The dynamic env value is now available in this and later steps.
      - name: Use the dynamic env variable
        run: |
          echo "This run is labeled: $RUN_LABEL"

      # 4) Step-level env: add or override variables for ONE step only.
      - name: Step-scoped env
        env:
          BROWSER: chrome
        run: echo "Running $TEST_TAGS on $BROWSER"

      # 5) Consume a secret SAFELY: pass it via env, never echo it.
      #    set +x stops the shell from tracing the command with the value.
      - name: Verify a secret without printing it
        run: |
          set +x
          python -c "import os; assert os.environ['ZEPHYR_SCALE_TOKEN'], 'missing token'"
          echo "ZEPHYR_SCALE_TOKEN is present (value hidden)"

      # 6) Pass a value to a LATER step using step outputs ($GITHUB_OUTPUT).
      - name: Produce a step output
        id: meta
        run: echo "report_name=allure-$RUN_LABEL" >> "$GITHUB_OUTPUT"

      - name: Consume the step output
        run: |
          echo "Report will be named: ${{ steps.meta.outputs.report_name }}"

  windows-env:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      TEST_TAGS: ${{ inputs.tags }}
      ZEPHYR_SCALE_TOKEN: ${{ secrets.ZEPHYR_SCALE_TOKEN }}
    steps:
      # 7) Read env in PowerShell with $env:VAR.
      - name: Read env in PowerShell
        shell: powershell
        run: |
          Write-Host "Report home : $env:REPORT_HOME"
          Write-Host "Behave tags : $env:TEST_TAGS"

      # 8) Set a dynamic env var on Windows (still uses $env:GITHUB_ENV file).
      - name: Create dynamic env in PowerShell
        shell: powershell
        run: |
          "RUN_LABEL=bdd-${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Use dynamic env in PowerShell
        shell: powershell
        run: |
          Write-Host "Run label: $env:RUN_LABEL"

      # 9) Read env in cmd with %VAR%.
      - name: Read env in cmd
        shell: cmd
        run: |
          echo Behave tags: %TEST_TAGS%
          echo Run label: %RUN_LABEL%
