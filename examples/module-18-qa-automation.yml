# Module 8: API health-check -> BDD UI automation chain with Allure reporting
name: module-08-qa-automation
on:
  schedule:
    - cron: "30 1 * * *"  # nightly regression at 1:30 AM UTC (7:00 AM IST)
  workflow_dispatch:
    inputs:
      tags:
        description: "BDD tags to run (e.g. smoke, regression)"
        default: "regression"
        required: true
      browser:
        description: "Browser"
        type: choice
        options: [chrome, firefox, msedge]
        default: chrome
        required: true
jobs:
  api-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install requests
        run: pip install requests

      - name: Verify application API health
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python scripts/api_health_check.py

  bdd-ui:
    needs: api-health  # only run UI tests if API layer is healthy
    runs-on: server4
    strategy:
      matrix:
        browser: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.browser)) || fromJSON('["chrome","firefox"]') }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install BDD dependencies
        run: pip install behave selenium allure-behave webdriver-manager

      - name: Execute BDD suite on ${{ matrix.browser }}
        env:
          TEST_TAGS: ${{ github.event.inputs.tags || 'regression' }}
          TEST_BROWSER: ${{ matrix.browser }}
        run: |
          behave --tags=$TEST_TAGS \
            -D browser=$TEST_BROWSER \
            --no-capture \
            -f allure_behave.formatter:AllureFormatter \
            -o reports/allure-results

      - name: Publish screenshots and Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bdd-results-${{ matrix.browser }}
          path: |
            reports/allure-results/
            reports/screenshots/
          retention-days: 30
