# Module 16: Selenium Grid via Docker Compose + Allure report caching
name: module-16-docker-performance
on:
  push:
    paths:
      - "your-solution-root-folder-name/**"
      - "features/**"
      - "docker-compose.yml"
jobs:
  selenium-grid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Start Selenium Grid
        run: docker compose -f docker-compose-grid.yml up -d
        # docker-compose-grid.yml starts selenium/hub + chrome/firefox nodes

      - name: Wait for Grid to be ready
        run: |
          timeout 60 bash -c \
            'until curl -sf http://localhost:4444/wd/hub/status | python -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d[\"value\"][\"ready\"] else 1)"; do sleep 2; done'

      - name: Run BDD smoke suite against Grid
        env:
          SELENIUM_HUB: "http://localhost:4444/wd/hub"
        run: |
          behave --tags=smoke \
            -D hub=$SELENIUM_HUB \
            -f allure_behave.formatter:AllureFormatter \
            -o reports/allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-grid-results
          path: reports/allure-results/
          retention-days: 30

      - name: Teardown Selenium Grid
        if: always()
        run: docker compose -f docker-compose-grid.yml down
