# Module 1: CI/CD foundations with fast feedback — Python BDD automation project
name: module-01-ci-foundations
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  sanity:
    name: Quick lint + smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint behave selenium allure-behave

      - name: Run smoke tests
        run: behave --tags=smoke --no-capture

      - name: Publish test evidence artifact
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results
          path: reports/
