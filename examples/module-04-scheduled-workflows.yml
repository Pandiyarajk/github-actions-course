# Module 12: Scheduling workflow runs with cron
#
# GitHub Actions evaluates all cron schedules in UTC. Convert your local time
# to UTC before committing (e.g. 7:00 AM IST = 1:30 AM UTC).
#
# Cron format (5 fields):
#   ┌───────────── minute        (0 - 59)
#   │ ┌───────────── hour        (0 - 23, UTC)
#   │ │ ┌───────────── day-of-month (1 - 31)
#   │ │ │ ┌───────────── month     (1 - 12)
#   │ │ │ │ ┌───────────── day-of-week (0 - 6, Sunday = 0)
#   │ │ │ │ │
#   * * * * *
#
# A workflow can list several schedules; each entry triggers an independent run.
name: module-12-scheduled-workflows
on:
  schedule:
    - cron: "0 * * * *"        # Hourly — at minute 0 of every hour
    - cron: "*/30 * * * *"     # Every 30 minutes
    - cron: "0 */6 * * *"      # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "30 1 * * *"       # Daily at 01:30 UTC (7:00 AM IST) — nightly smoke
    - cron: "0 2 * * 1"        # Weekly on Monday at 02:00 UTC
    - cron: "0 3 * * 1-5"      # Weekdays (Mon–Fri) at 03:00 UTC
    - cron: "0 4 * * 0,6"      # Weekends (Sat & Sun) at 04:00 UTC
    - cron: "0 5 1 * *"        # Monthly on the 1st at 05:00 UTC
  workflow_dispatch:            # also allow manual runs for testing

jobs:
  identify-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # github.event.schedule holds the exact cron string that fired the run.
      # Use it to branch logic so one workflow can serve many cadences.
      - name: Report which schedule triggered this run
        env:
          TRIGGER: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os

          trigger = os.environ.get("TRIGGER", "")
          schedule = os.environ.get("SCHEDULE", "")

          labels = {
              "0 * * * *": "Hourly",
              "*/30 * * * *": "Every 30 minutes",
              "0 */6 * * *": "Every 6 hours",
              "30 1 * * *": "Daily nightly smoke",
              "0 2 * * 1": "Weekly (Monday)",
              "0 3 * * 1-5": "Weekdays",
              "0 4 * * 0,6": "Weekend",
              "0 5 1 * *": "Monthly (1st)",
          }

          if trigger == "schedule":
              print(f"Triggered by schedule: {schedule}")
              print(f"Cadence: {labels.get(schedule, 'Unknown cadence')}")
          else:
              print(f"Triggered manually via {trigger}")
          PY

      # Example: only run the heavy regression suite on the daily nightly cron.
      - name: Run nightly regression (daily schedule only)
        if: github.event.schedule == '30 1 * * *'
        run: echo "behave --tags=regression --no-capture"

      # Example: run a lightweight health check on the hourly cron.
      - name: Run hourly health check
        if: github.event.schedule == '0 * * * *'
        run: echo "python scripts/hello.py --tag healthcheck"
