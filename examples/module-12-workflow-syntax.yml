# Module 12: Job relationships, expressions, and outputs — Python BDD pipeline
name: module-12-workflow-syntax
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.meta.outputs.run-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Stamp run metadata
        id: meta
        run: echo "run-id=bdd-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Install static analysis tools
        run: |
          pip install pylint check-duplicate-functions

      - name: Run pylint on changed Python files
        run: pylint your-solution-root-folder-name/ --exit-zero

  behave-smoke:
    needs: static-checks  # only run BDD smoke if static checks pass
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'docs-only') }}
    steps:
      - name: Announce test run
        run: echo "Running BDD smoke suite for run ${{ needs.static-checks.outputs.run-id }}"
