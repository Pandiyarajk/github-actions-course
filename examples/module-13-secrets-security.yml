# Module 13: Secrets, permissions, and secure credential handling — Python automation
name: module-13-secrets-security
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install secret-consuming packages
        run: |
          pip install zephyr-jira-linker zephyr-scale-test-cycle jira-ticket-updater

      - name: Verify Zephyr Scale token
        env:
          ZEPHYR_SCALE_TOKEN: ${{ secrets.ZEPHYR_SCALE_TOKEN }}
        run: |
          set +x  # never echo secrets
          python -c "import os; assert os.environ['ZEPHYR_SCALE_TOKEN'], 'ZEPHYR_SCALE_TOKEN missing'"
          echo "Zephyr Scale token present"

      - name: Verify Jira credentials
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        run: |
          set +x
          python -c "
          import os
          for var in ['JIRA_EMAIL', 'JIRA_API_TOKEN', 'JIRA_BASE_URL']:
              assert os.environ.get(var), f'{var} missing'
          print('All Jira secrets present')
          "

      - name: Verify SMTP credentials
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          set +x
          python -c "
          import os
          for var in ['EMAIL_USER', 'EMAIL_PASS', 'SMTP_HOST', 'SMTP_PORT']:
              assert os.environ.get(var), f'{var} missing'
          print('All SMTP secrets present')
          "
