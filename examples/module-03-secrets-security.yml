# Module 3: Secrets, permissions, and OIDC
name: module-03-secrets-security
on: workflow_dispatch
permissions:
  id-token: write  # required for minting short-lived cloud creds
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS assuming role  # avoids storing long-lived keys
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/DemoDeployRole
          aws-region: us-east-1

      - name: Deploy using masked secret
        env:
          QA_DB_CONN: ${{ secrets.QA_DB_CONN }}  # never echo this value
        run: |
          # Keep debugging noise low and consume the secret securely.
          set +x
          python scripts/deploy.py "$QA_DB_CONN"
